version: "3.9"

services:
  backend:
    build: ./backend
    container_name: licenselens-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./licenselens.db
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: licenselens-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
